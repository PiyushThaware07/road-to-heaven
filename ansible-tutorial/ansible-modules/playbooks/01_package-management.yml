---
- name: Manage packages
  hosts: webservers
  become: true

  tasks:

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Remove apache2
      ansible.builtin.apt:
        name: apache2
        state: absent

    - name: Install multiple packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - wget
          - unzip
        state: present
